# example_hosts.conf - Configuration template for sendorbit
#
# FORMAT:
# "user host dest_folder"                    ← default port 22
# "user host dest_folder port"               ← custom port
#
# The "host" field accepts:
#   - IP              → 1xx.1xx.1.1xx
#   - hostname/DNS    → server.example.com
#   - SSH alias       → prod-web  (must exist in ~/.ssh/config)
#
# SSH ALIAS from ~/.ssh/config:
#   SSH resolves the alias natively (hostname, port, IdentityFile,
#   User). Host key verification and connection use the alias
#   directly — no more ssh -G or ssh-keyscan needed.
#   IMPORTANT: the "user" in hosts.conf must match the
#   User defined in ~/.ssh/config for that alias.
#   Example ~/.ssh/config entry for alias "prod-web":
#     Host prod-web
#         HostName 203.0.113.50
#         User admin
#         Port 2222
#         IdentityFile ~/.ssh/id_ed25519
#
# SSH KEYS WITH PASSPHRASE:
#   - With ssh-agent loaded: works without intervention.
#   - Without ssh-agent: SSH will prompt for the passphrase
#     interactively during connection.
#
# SECURITY RECOMMENDATIONS:
# - Only add hosts you trust
# - Never store passwords here
# - Keep permissions 600 on hosts.conf
#
# Copy this file to config/hosts.conf and edit it

configs=(
    # === Direct IP (port 22 by default) ===
    "user 1xx.1xx.1.1xx backups"

    # === Hostname + custom port ===
    # "admin mi-servidor.com /home/admin/deploy 2222"

    # === SSH alias (defined in ~/.ssh/config) ===
    # "admin prod-web /var/www/proyecto"

    # === Absolute destination path ===
    # "user 10.0.0.45 /opt/data"
)